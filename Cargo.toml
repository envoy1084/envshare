[workspace]
members = [
    "crates/cli",
    "crates/code",
    "crates/core",
    "crates/crypto",
    "crates/network",
    "crates/node",
    "crates/protocol",
    "crates/testkit",
]
resolver = "3"
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
authors = ["Envshare contributors"]
license = "Apache-2.0"
repository = "https://github.com/envoy1084/envshare"
homepage = "https://github.com/envoy1084/envshare"
keywords = ["dotenv", "libp2p", "p2p", "secrets"]
categories = ["command-line-utilities", "network-programming"]

[workspace.dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
clap = { version = "4.6.0", features = ["derive", "wrap_help"] }
clap_complete = "4.5.65"
clap_mangen = "0.3.3"
code = { version = "=0.1.0", path = "crates/code" }
app-core = { package = "core", version = "=0.1.0", path = "crates/core" }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
crypto = { version = "=0.1.0", path = "crates/crypto" }
dotenvy = "0.15.7"
getrandom = "0.4.3"
futures = "0.3.32"
hkdf = "0.13.0"
hmac = { version = "0.13.0", features = ["zeroize"] }
humantime = "2.4.0"
network = { version = "=0.1.0", path = "crates/network" }
nix = { version = "0.31.3", features = ["process", "signal"] }
opentelemetry = { version = "0.32.0", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls-webpki-roots", "trace"] }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = ["trace"] }
protocol = { version = "=0.1.0", path = "crates/protocol" }
process-wrap = { version = "9.1.0", default-features = false, features = ["job-object", "kill-on-drop", "process-group", "tokio1"] }
prost = "0.14.4"
rpassword = "7.5.4"
libp2p = { version = "0.56.0", default-features = false, features = [
    "dcutr",
    "ed25519",
    "identify",
    "macros",
    "memory-connection-limits",
    "noise",
    "ping",
    "quic",
    "relay",
    "rendezvous",
    "request-response",
    "tcp",
    "tokio",
    "yamux",
] }
mdns-sd = { version = "0.21.0", default-features = false, features = ["async"] }
minicbor = { version = "2.3.0", features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = { version = "0.11.0", features = ["zeroize"] }
subtle = "2.6.1"
thiserror = "2.0.18"
tempfile = "3.27.0"
tokio = { version = "1.53.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.33.0", default-features = false }
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }
zeroize = { version = "1.9.0", features = ["derive"] }
windows-permissions = "0.2.4"

[workspace.dependencies.proptest]
version = "1.9.0"
default-features = false
features = ["std"]

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "warn"
panic = "warn"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[profile.dist]
inherits = "release"
lto = "fat"

[workspace.metadata.dist]
# The generated workflow is intentionally kept Apache-2.0-only, publishes the
# first-party installers, and carries a cargo-dist 0.32.0 SBOM output fix.
# Review those local changes explicitly on cargo-dist upgrades.
allow-dirty = ["ci"]
cargo-dist-version = "0.32.0"
ci = ["github"]
packages = ["cli", "node"]
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
checksum = "sha256"
cargo-auditable = true
cargo-cyclonedx = true
github-attestations = true
github-attestations-phase = "host"
github-release = "host"
install-success-msg = "Envshare is installed. Run 'envshare --help' to get started."
pr-run-mode = "plan"
source-tarball = true

[workspace.metadata.dist.github-action-commits]
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6"
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803"
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c"
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
