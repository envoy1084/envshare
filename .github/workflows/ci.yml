name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Run focused protocol and cryptography tests
        run: cargo test --locked --package code --package crypto --package protocol
      - name: Verify private Windows output ACLs
        if: runner.os == 'Windows'
        run: cargo test --locked --package core windows_output_grants_only_current_user_full_control

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install policy tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.19.9 --locked
      - name: Check security advisories
        run: cargo audit
      - name: Check licenses, sources, and bans
        run: cargo deny check
      - name: Verify patched Rendezvous dependency
        run: cargo tree -i libp2p-rendezvous --locked | grep 'libp2p-rendezvous v0.17.1'

  installer-smoke:
    name: Installer smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Build release client
        run: cargo build --release --locked --package cli
      - name: Test Unix installer on a clean runner
        if: runner.os != 'Windows'
        run: ./scripts/test-install.sh
      - name: Test PowerShell installer on a clean runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-install.ps1
