[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # Transitive through if-watch/libp2p TCP and QUIC on Linux. This is an
    # unmaintained proc-macro advisory, not a vulnerability. Remove the exception
    # as soon as upstream netlink crates migrate away from paste.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BlueOak-1.0.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
